[package]
name = "xd-xk-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.5", features = ["derive"] }
ddddocr = "0.1.0"
# ONNX Runtime：ddddocr-rs 的推理后端，这里显式声明同一版本。
ort = "2.0.0-rc.13"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "query", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "0.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "sync", "io-util", "io-std"] }

[patch.crates-io]
ddddocr = { path = "vendor/ddddocr" }
