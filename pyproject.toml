[project]
name = "xd-xk"
version = "2.0.0"
description = "西安电子科技大学自动选课工具"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "But-For-Love" },
]

dependencies = [
    "ddddocr>=1.6",
    "pillow>=11.0",
    "pycryptodomex>=3.21.0",
    "requests>=2.32.0",
    "ttkbootstrap>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.9.0",
]

[project.scripts]
xd-xk = "xd_xk.cli:main"
xd-xk-gui = "xd_xk.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["B904", "N802"]

[tool.ruff.lint.per-file-ignores]
"xd_xk/gui.py" = ["F405", "F403"]  # ttkbootstrap star import

[tool.ruff.lint.isort]
known-first-party = ["xd_xk"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["xd_xk"]
